name: sports-live
description: "Naver structured sports API로 라이브 점수·종료 경기 결과·팀/선수 순위를 KST 신선도와 출처 URL이 있는 typed evidence로 검증"
trigger: "스포츠 라이브, 실시간 경기, 현재 결과, 어제 경기, 야구, 축구, 농구, 배구, 골프, LPGA, 리더보드, LoL, LCK, 순위, standings, ranking"

skills:
  - naver-sports-skill

capability:
  domains: [sports]
  intents: [current_result, completed_result, live_score, standings, ranking, leaderboard]
  read_only: true
  side_effects: false
  freshness_sensitive: true
  direct_answer: true
  requires_confirmation: false
  coverage: full_coverage
  input_contract: query.v1
  output_contract: asset_result.v1
  fallback_modes: [answer_with_evidence]
  retry_statuses: [failed_retryable]

input_contract:
  contract_id: recipe.sports-live.input
  version: "1"
  owner_ref:
    type: recipe
    name: sports-live
  json_schema:
    type: object
    properties:
      query:
        type: string
        minLength: 1
    required: [query]
    additionalProperties: false

output_contract:
  contract_id: recipe.sports-live.output
  version: "1"
  owner_ref:
    type: recipe
    name: sports-live
  json_schema:
    type: object
    x-simpleclaw-composition-fields:
      - data.mode
      - data.category
      - data.season.code
      - data.season.title
      - data.date
      - data.fetched_at
      - data.freshness.as_of
      - data.items[*].rank
      - data.items[*].team
      - data.items[*].name
      - data.items[*].wins
      - data.items[*].losses
      - data.items[*].draws
      - data.items[*].games_behind
      - data.items[*].title
      - data.items[*].status
      - data.items[*].event_state
      - data.items[*].status_code
      - data.items[*].participants.away.name
      - data.items[*].participants.home.name
      - data.items[*].score.away
      - data.items[*].score.home
      - data.items[*].winner
      - data.items[*].date
      - data.items[*].fetched_at
      - data.items[*].source_url
      - data.warnings[*]
      - data.source.urls[*]

step_bindings:
  - binding_id: naver-sports-query.v1
    owner_ref:
      type: recipe
      name: sports-live
    binding:
      target_skill: naver-sports-skill
      map:
        query: args
      argument_constraints:
        - name: limit
          source: query
          strategy: bounded_integer_between_markers
          prefixes: ["상위", "top", "앞"]
          prefix_optional: true
          suffixes: ["개 팀", "팀", "teams", "team"]
          default: 10
          minimum: 1
          maximum: 20
          argument_name: args
          flag: "--limit"

parameters:
  - name: query
    description: "Capability-first exact 실행의 standalone 자연어 질문"
    required: false
    default: ""
  - name: category
    description: "수동 실행 종목/리그"
    required: false
    default: "kbo"
  - name: mode
    description: "수동 실행 모드: auto, live, results, standings"
    required: false
    default: "auto"
  - name: date
    description: "수동 live/results 조회 날짜: today 또는 YYYY-MM-DD (KST)"
    required: false
    default: "today"
  - name: season
    description: "수동 standings 시즌; auto면 helper가 활성 시즌을 선택"
    required: false
    default: "auto"
  - name: limit
    description: "최대 결과 수 1..20"
    required: false
    default: "10"

instructions: |
  ## Naver structured sports evidence

  - 실행 시각: {{ now }} KST
  - query.v1: {{ query }}
  - 수동 입력: category={{ category }}, mode={{ mode }}, date={{ date }}, season={{ season }}, limit={{ limit }}

  `query.v1`이 비어 있지 않으면 category/mode/date/season/player를 자연어 질문에서
  해석한다. 이 경우 수동 입력의 기본값 `kbo/auto/today/auto/10`은 사용자가 직접
  말한 값으로 간주하지 않는다. 질문에 없는 값만 안전한 helper 기본값으로 둔다.
  `query.v1`이 비어 있으면 기존 수동 parameter 경로를 그대로 사용한다.

  Recipe binding이 해석한 canonical `limit={{ limit }}`은 helper argv의 exact
  `--limit {{ limit }}`로 반드시 보존한다. 질문에 `상위 3팀`, `3팀만`, `top 3 teams`
  같은 명시 count가 있으면 그 값을 사용하고, 명시 count가 없을 때만 기본값 10을
  사용한다. 1..20 밖의 값이나 서로 다른 count가 함께 있으면 실행하지 않는다.

  허용된 `naver-sports-skill`을 정확히 한 번 실행한다. 처음 사용해도 별도
  `skill_docs`, web/search/browser, generic realtime/KBO collector, command를
  호출하지 않는다. 등록된 `execute_skill`만 사용한다.

  helper args는 질문 또는 수동 입력을 recipe 내부에서 다음 형태로 정규화한다.

  먼저 질문을 `live|completed_result|standings` typed intent로 정규화한다.

  - 현재 진행 중·실시간·라이브 점수는 `live`
  - 과거 날짜·어제·종료·최종 경기 점수/승패는 `completed_result`
  - 순위·랭킹·standings·leaderboard는 `standings`

  helper invocation은 typed intent를 다음 registered mode로만 전달한다.

  `--mode <live|results|standings> --category <category> --date <today|YYYY-MM-DD> [--season <season>] --limit <1..20> --json`

  season을 trim한 뒤 `auto`이면 active/latest enabled season 자동 선택을 뜻하므로 helper
  args에서 `--season` 자체를 생략한다. `auto`가 아닌 값만 명시 provider season으로
  `--season <season>`에 전달하며 unknown 명시값을 다른 시즌으로 대체하지 않는다.
  방어적으로 helper 자체도 문서화된 `--season auto` sentinel을 동일하게 지원한다.

  category는 kbo/mlb/npb, kleague/epl 및 명시 리그 ID, basketball/kbl/nba/wkbl,
  volleyball/kovo/wkovo, general/atp/wta/ufc, golf/pga/lpga/kpga/klpga,
  esports/lol/lck 별칭을 해석한다. 어제/오늘은 실행 시각 KST 기준 날짜로 만든다.
  미지원 명시 값은 KBO로 대체하지 않는다. mode가 auto이면 위 typed intent를 먼저
  결정한 뒤 `live→live`, `completed_result→results`, `standings→standings`로 매핑한다.
  `STARTED` empty를 과거 종료 경기 부재로 해석하거나 동일 asset/signature로 재시도하지
  않는다.

  helper stdout JSON의 `ok`, `items`, `error.retryable`을 엄격히 구분한다.

  - ok=true + items 존재: completed
  - ok=true + items=[]: live는 live empty, results는 completed-result empty,
    명시 대상/순위 부재는 not_found
  - ok=false + retryable=true: failed_retryable
  - ok=false + retryable=false 또는 schema/JSON 오류: failed_terminal

  exact 실행의 최종 출력은 `asset_result.v1` JSON object 하나뿐이다. Markdown fence나
  자연어 머리말을 붙이지 않는다. `data`에는 helper 결과를 bounded object로 보존한다.
  helper가 typed JSON을 한 번 성공 반환한 뒤에는 final 출력 형식 오류가 있더라도
  동일 helper를 다시 호출하지 않고, 첫 observation만으로 envelope를 완성한다.
  helper `claim_map`은 provider가 실제 관찰한 `game_result|score|winner` typed key와
  value/source_url/observed_at/fresh를 보존한다. `evidence` 각 항목은 정확한 required
  claim ID를 `claim_id`로 쓰고, 그 claim을 실제로 충족하는 `claim_map` key만
  `claim_keys` 배열에 넣는다. 예를 들어 경기 결과와 점수 claim은
  `game_result`와 `score`를 bind한다. claim_map에 없는 attendance 같은 key를 만들거나
  non-empty items만으로 claim을 해결하지 않는다. source URL, 관찰시각, freshness가
  완전한 typed key만 resolved_claims에 넣고 나머지는 unresolved_claims와 limitations에
  둔다. results item의 event_state,
  status_code, score, winner, date, fetched_at, source_url을 그대로 보존한다. Naver 지연
  가능성도 limitation으로 남긴다. 정상 empty/not_found를 실패나 사실 단정으로
  바꾸지 않는다.

  query 유무와 무관하게 Recipe는 typed state·fact·provenance만 반환한다. 최종 문장,
  말투, Markdown, persona 적용은 중앙 composer가 담당하며 `answer/content/text/summary`
  필드를 만들지 않는다.
